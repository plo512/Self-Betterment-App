<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self-Betterment</title>
<meta name="description" content="Daily plan: Power BI, home accessibility modifications, core strength.">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Betterment">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <span class="wordmark">SELF-BETTERMENT</span>
      <span class="datebadge" id="dateBadge">—</span>
    </div>
    <div class="gauge-strip" id="gaugeStrip">
      <div class="gauge"><div class="gauge-fill core" id="gaugeCore"></div></div>
      <div class="gauge"><div class="gauge-fill powerbi" id="gaugePowerbi"></div></div>
      <div class="gauge"><div class="gauge-fill homemods" id="gaugeHomemods"></div></div>
    </div>
    <div class="stat-readout" id="statReadout">—</div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
</div>

<div id="runner" class="runner hidden"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
